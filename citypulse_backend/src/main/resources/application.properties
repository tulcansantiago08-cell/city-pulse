spring.application.name=citypulse

# MongoDB — define MONGODB_URI con tu propia cadena de conexión (por ejemplo, MongoDB Atlas).
# Si no se define, se usa una instancia local.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/citypulse_db}
spring.data.mongodb.database=citypulse_db

server.port=8080

# Logging
logging.level.root=INFO
logging.level.com.citypulse=DEBUG

# Jackson — serializar LocalDateTime como ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
