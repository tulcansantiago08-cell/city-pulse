spring.application.name=citypulse

# Lee variables locales desde citypulse_backend/.env si existe (no se sube a GitHub)
spring.config.import=optional:file:.env[.properties]

# MongoDB — define MONGODB_URI con tu propia cadena de conexión (por ejemplo, MongoDB Atlas).
# Si no se define, se usa una instancia local.
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/citypulse_db}
spring.data.mongodb.database=citypulse_db

server.port=8080

# JWT (RNF-010): clave de al menos 256 bits en JWT_SECRET; los tokens duran 24 horas
citypulse.jwt.secret=${JWT_SECRET:}
citypulse.jwt.expiracion-horas=24

# Primer administrador (solo se crea si la base no tiene ninguno)
citypulse.admin.correo=${ADMIN_CORREO:}
citypulse.admin.password=${ADMIN_PASSWORD:}
citypulse.admin.nombre=${ADMIN_NOMBRE:Administrador}
citypulse.admin.apellido=${ADMIN_APELLIDO:City Pulse}

# Logging
logging.level.root=INFO
logging.level.com.citypulse=DEBUG

# Jackson — serializar LocalDateTime como ISO-8601
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss
